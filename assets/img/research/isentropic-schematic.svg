<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 470 272" role="img"
     aria-label="Schematic: the same aircraft samples viewed in latitude-pressure space and in a mass-weighted isentropic coordinate">
<style>
  .ink{fill:#1f2124}.muted{fill:#63666c}.faint{fill:#8b8e94}
  .panel{fill:#f7f7f4;stroke:#c9ced4}
  .grid{stroke:#d5d8dc;fill:none}
  .theta{stroke:#7a2e2e;fill:none;opacity:.55}
  .ax{stroke:#8b8e94;fill:none}
  .arrow{stroke:#63666c;fill:none}
  .c1{fill:#2f6f8f}.c2{fill:#6a9ab4}.c3{fill:#b48f7a}.c4{fill:#7a2e2e}
  text{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
  .t{font-size:11.5px}.ts{font-size:10px}.tt{font-size:12px;font-weight:650}
  @media (prefers-color-scheme: dark){
    .ink{fill:#e8e6e1}.muted{fill:#a4a8ae}.faint{fill:#7d8187}
    .panel{fill:#1b1e20;stroke:#3a4045}.grid{stroke:#33383c}
    .theta{stroke:#d99a9a}.ax{stroke:#7d8187}.arrow{stroke:#a4a8ae}
    .c1{fill:#7fb4d0}.c2{fill:#5d8ba3}.c3{fill:#b98f84}.c4{fill:#d99a9a}
  }
</style>
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0.5 1 L9 5 L0.5 9 z" fill="#63666c"/>
  </marker>
</defs>

<!-- ── panel A: latitude–pressure ── -->
<text x="14" y="20" class="tt ink">Latitude &#8211; pressure</text>
<text x="14" y="36" class="ts muted">sampling gaps bias the mean</text>
<rect x="14" y="46" width="186" height="196" rx="3" class="panel"/>
<g class="grid">
  <path d="M14 88 H200"/><path d="M14 130 H200"/><path d="M14 172 H200"/><path d="M14 214 H200"/>
</g>
<!-- mixed air masses on one level -->
<g>
  <circle cx="42"  cy="70"  r="4.5" class="c1"/><circle cx="82"  cy="70"  r="4.5" class="c2"/>
  <circle cx="132" cy="70"  r="4.5" class="c1"/><circle cx="172" cy="70"  r="4.5" class="c4"/>
  <circle cx="42"  cy="112" r="4.5" class="c2"/><circle cx="92"  cy="112" r="4.5" class="c4"/>
  <circle cx="146" cy="112" r="4.5" class="c2"/>
  <circle cx="58"  cy="152" r="4.5" class="c3"/><circle cx="108" cy="152" r="4.5" class="c1"/>
  <circle cx="166" cy="152" r="4.5" class="c3"/>
  <circle cx="36"  cy="196" r="4.5" class="c4"/><circle cx="96"  cy="196" r="4.5" class="c3"/>
  <circle cx="152" cy="196" r="4.5" class="c4"/><circle cx="184" cy="196" r="4.5" class="c2"/>
</g>
<!-- isentropes cutting across levels -->
<g class="theta" stroke-width="1.6">
  <path d="M14 232 C70 226 120 196 200 150"/>
  <path d="M14 196 C70 190 120 158 200 108"/>
  <path d="M14 152 C70 146 122 112 200 66"/>
</g>
<text x="150" y="236" class="ts" fill="#7a2e2e" opacity=".8">&#952;</text>
<text x="18" y="258" class="ts faint">equator</text>
<text x="196" y="258" class="ts faint" text-anchor="end">pole</text>

<!-- transform arrow -->
<path d="M212 144 H252" class="arrow" stroke-width="1.6" marker-end="url(#ar)"/>
<text x="232" y="134" class="ts muted" text-anchor="middle">reorder by</text>
<text x="232" y="164" class="ts muted" text-anchor="middle">mass &amp; &#952;</text>

<!-- ── panel B: isentropic ── -->
<text x="264" y="20" class="tt ink">Mass-weighted &#952;</text>
<text x="264" y="36" class="ts muted">air masses stay together</text>
<rect x="264" y="46" width="192" height="196" rx="3" class="panel"/>
<g class="grid">
  <path d="M264 88 H456"/><path d="M264 130 H456"/><path d="M264 172 H456"/><path d="M264 214 H456"/>
</g>
<g>
  <circle cx="292" cy="70"  r="4.5" class="c1"/><circle cx="332" cy="70"  r="4.5" class="c1"/>
  <circle cx="372" cy="70"  r="4.5" class="c1"/><circle cx="412" cy="70"  r="4.5" class="c2"/>
  <circle cx="292" cy="112" r="4.5" class="c2"/><circle cx="342" cy="112" r="4.5" class="c2"/>
  <circle cx="396" cy="112" r="4.5" class="c2"/>
  <circle cx="300" cy="152" r="4.5" class="c3"/><circle cx="356" cy="152" r="4.5" class="c3"/>
  <circle cx="412" cy="152" r="4.5" class="c3"/>
  <circle cx="288" cy="196" r="4.5" class="c4"/><circle cx="340" cy="196" r="4.5" class="c4"/>
  <circle cx="392" cy="196" r="4.5" class="c4"/><circle cx="436" cy="196" r="4.5" class="c4"/>
</g>
<g class="theta" stroke-width="1.6">
  <path d="M264 91 H456"/><path d="M264 133 H456"/><path d="M264 175 H456"/>
</g>
<text x="268" y="258" class="ts faint">tropical air</text>
<text x="452" y="258" class="ts faint" text-anchor="end">polar air</text>

</svg>
